[project]
name = "witness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "meta_sam_parser",
    "Pillow",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["witness*"]
