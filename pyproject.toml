[project]
name = "witness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "meta_sam_parser",
    "Pillow",
    "httpx",
    "fastapi",
    "modal",
    "playwright",
]

# System tools, not pip packages: ffmpeg (8.x) and a Playwright
# Chromium (playwright install chromium) for MP4 recording.

[project.optional-dependencies]
dev = ["pytest", "pip-audit"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["witness*"]
